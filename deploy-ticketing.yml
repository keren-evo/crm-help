name: Deploy ticketing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ticketing/**'
      - '.github/workflows/deploy-ticketing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ticketing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ticketing/package-lock.json

      - name: Install & build
        working-directory: ticketing
        env:
          # GitHub Pages project sites are served at /{repo-name}/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ticketing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
